<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://izdxvlcpaplrtmcinwkz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_HZvFWsF9fq4nzmtXy9_Okw_yfIq3RNw";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   PDF 설정
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let fullText = "";
let selectedElement = null;


/* =========================
   파일 버튼
========================= */

document
  .getElementById("pdfInput")
  .addEventListener(
    "change",
    e => handlePDF(e.target.files[0])
  );

document
  .getElementById("pdfInputBig")
  .addEventListener(
    "change",
    e => handlePDF(e.target.files[0])
  );

document
  .getElementById("imageInput")
  .addEventListener(
    "change",
    e => handleImage(e.target.files[0])
  );

document
  .getElementById("imageInputBig")
  .addEventListener(
    "change",
    e => handleImage(e.target.files[0])
  );


/* =========================
   상태
========================= */

function showStatus(message) {
  const box =
    document.getElementById("status");

  box.textContent = message;
  box.style.display = "block";
}

function hideStatus() {
  document
    .getElementById("status")
    .style.display = "none";
}


/* =========================
   PDF의 원래 줄 복원

   PDF 안의 글자는
   글자 + 화면 위치 정보로 저장된다.

   Y좌표가 비슷한 글자들을
   같은 줄로 묶는다.
========================= */

function extractPageLines(items) {

  const usable =
    items
      .filter(
        item =>
          item.str &&
          item.str.trim()
      )
      .map(item => ({
        text: item.str,

        x:
          item.transform
            ? item.transform[4]
            : 0,

        y:
          item.transform
            ? item.transform[5]
            : 0,

        width:
          item.width || 0
      }));


  if (!usable.length) {
    return "";
  }


  const lines = [];

  /*
    글자의 Y좌표가 몇 픽셀 정도
    차이나는 것은 같은 줄로 본다.
  */

  const yTolerance = 3.5;


  for (const item of usable) {

    let line =
      lines.find(
        current =>
          Math.abs(
            current.y - item.y
          ) <= yTolerance
      );


    if (!line) {

      line = {
        y: item.y,
        items: []
      };

      lines.push(line);
    }


    line.items.push(item);

  }


  /*
    PDF 좌표는 아래에서 위로 커지므로
    Y값이 큰 줄부터 화면 위쪽이다.
  */

  lines.sort(
    (a, b) => b.y - a.y
  );


  return lines
    .map(line => {

      /*
        같은 줄에서는
        왼쪽 → 오른쪽 순서
      */

      line.items.sort(
        (a, b) => a.x - b.x
      );


      let output = "";

      let previous = null;


      for (
        const item of line.items
      ) {

        if (previous) {

          const previousEnd =
            previous.x +
            previous.width;


          const gap =
            item.x -
            previousEnd;


          /*
            글자 조각이 실제로 떨어져 있을 때만
            공백을 추가한다.

            예전처럼 모든 item 사이에
            강제로 공백을 넣지 않는다.
          */

          if (
            gap > 2.5 &&
            !/[\s([{“‘]$/.test(
              output
            )
          ) {

            output += " ";

          }

        }


        output += item.text;

        previous = item;

      }


      return output.trim();

    })
    .filter(Boolean)
    .join("\n");

}


/* =========================
   PDF 읽기
========================= */

async function handlePDF(file) {

  if (!file) return;


  showStatus(
    "PDF를 읽고 있어요..."
  );


  try {

    const buffer =
      await file.arrayBuffer();


    const pdf =
      await pdfjsLib
        .getDocument({
          data: buffer
        })
        .promise;


    const pages = [];


    for (
      let pageNumber = 1;
      pageNumber <= pdf.numPages;
      pageNumber++
    ) {

      showStatus(
        `PDF ${pageNumber}/${pdf.numPages} 페이지 읽는 중...`
      );


      const page =
        await pdf.getPage(
          pageNumber
        );


      const content =
        await page
          .getTextContent();


      /*
        핵심 변경점:
        item.str을 전부 join(" ") 하지 않고
        PDF 위치를 이용해 줄을 복원한다.
      */

      const pageText =
        extractPageLines(
          content.items
        );


      if (pageText) {

        pages.push(
          pageText
        );

      }

    }


    const text =
      cleanText(
        pages.join("\n\n")
      );


    if (!containsChinese(text)) {

      alert(
        "이 PDF에서는 중국어 텍스트를 바로 읽지 못했어요. " +
        "스캔된 PDF라면 사진으로 올려 주세요."
      );

      hideStatus();

      return;

    }


    openDocument(
      text,
      file.name
    );


  } catch (error) {

    console.error(error);

    alert(
      "PDF를 읽는 중 오류가 발생했어요."
    );

  }


  hideStatus();

}


/* =========================
   사진 OCR
========================= */

async function handleImage(file) {

  if (!file) return;


  showStatus(
    "사진 속 중국어를 읽고 있어요. 잠시 기다려 주세요..."
  );


  try {

    const result =
      await Tesseract.recognize(
        file,
        "chi_sim+eng",
        {
          logger: info => {

            if (
              info.status ===
              "recognizing text"
            ) {

              const percent =
                Math.round(
                  (info.progress || 0)
                  * 100
                );


              showStatus(
                `글자 인식 중... ${percent}%`
              );

            }

          }
        }
      );


    const text =
      cleanText(
        result.data.text
      );


    if (!text) {

      alert(
        "사진에서 글자를 찾지 못했어요."
      );

      hideStatus();

      return;

    }


    openDocument(
      text,
      file.name
    );


  } catch (error) {

    console.error(error);

    alert(
      "사진 글자 인식 중 오류가 발생했어요."
    );

  }


  hideStatus();

}


/* =========================
   텍스트 정리
========================= */

function cleanText(text) {

  return text
    .replace(/\r/g, "")
    .replace(/[ \t]+/g, " ")
    .replace(/[ \t]+\n/g, "\n")
    .replace(/\n[ \t]+/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();

}


function containsChinese(text) {

  return /[\u3400-\u9FFF]/.test(
    text
  );

}


/* =========================
   문서 열기
========================= */

function openDocument(
  text,
  fileName
) {

  fullText = text;


  document
    .getElementById(
      "startScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "studyApp"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "documentTitle"
    )
    .textContent =
      fileName || "";


  renderScript(text);


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   문장/줄 분리

   PDF에서 복원한 줄바꿈을
   우선적으로 보존한다.
========================= */

function splitSentences(text) {

  const lines =
    text
      .split(/\n+/)
      .map(
        line =>
          line.trim()
      )
      .filter(Boolean);


  const result = [];


  for (const line of lines) {

    const pieces =
      line.match(
        /[^。！？!?]+[。！？!?]?/g
      );


    if (pieces) {

      result.push(
        ...pieces
          .map(
            item =>
              item.trim()
          )
          .filter(Boolean)
      );

    } else {

      result.push(line);

    }

  }


  return result;

}


/* =========================
   중국어 단어 분리
========================= */

const functionWords =
  new Set([
    "很",
    "太",
    "真",
    "更",
    "最",
    "也",
    "都",
    "还",
    "就",
    "才",
    "又",
    "再",
    "不",
    "没",
    "别",
    "的",
    "了",
    "着",
    "过",
    "吗",
    "呢",
    "吧",
    "啊",
    "呀",
    "我",
    "你",
    "他",
    "她",
    "它",
    "我们",
    "你们",
    "他们"
  ]);


function segmentChinese(text) {

  if (
    typeof Intl !== "undefined" &&
    Intl.Segmenter
  ) {

    const segmenter =
      new Intl.Segmenter(
        "zh",
        {
          granularity: "word"
        }
      );


    const raw =
      [
        ...segmenter.segment(
          text
        )
      ];


    const output = [];


    for (const item of raw) {

      const token =
        item.segment;


      if (
        !item.isWordLike ||
        !containsChinese(token)
      ) {

        output.push({
          text: token,
          clickable: false
        });

        continue;

      }


      const divided =
        splitLearningToken(
          token
        );


      divided.forEach(
        part => {

          output.push({
            text: part,

            clickable:
              containsChinese(
                part
              )
          });

        }
      );

    }


    return output;

  }


  return [...text]
    .map(char => ({
      text: char,

      clickable:
        containsChinese(char)
    }));

}


/* =========================
   很喜欢 → 很 / 喜欢
========================= */

function splitLearningToken(
  token
) {

  if (
    functionWords.has(
      token
    )
  ) {

    return [token];

  }


  const result = [];

  let rest = token;


  const orderedWords =
    [...functionWords]
      .sort(
        (a, b) =>
          b.length -
          a.length
      );


  while (rest.length) {

    let matched = false;


    for (
      const word of
      orderedWords
    ) {

      if (
        rest.startsWith(
          word
        ) &&
        rest !== word
      ) {

        result.push(word);

        rest =
          rest.slice(
            word.length
          );

        matched = true;

        break;

      }

    }


    if (!matched) {

      result.push(rest);

      break;

    }

  }


  return result;

}


/* =========================
   대본 표시
========================= */

function renderScript(text) {

  const container =
    document.getElementById(
      "scriptText"
    );


  container.innerHTML = "";


  const sentences =
    splitSentences(text);


  sentences.forEach(
    sentence => {

      const sentenceElement =
        document.createElement(
          "div"
        );


      sentenceElement.className =
        "sentence";


      const tokens =
        segmentChinese(
          sentence
        );


      tokens.forEach(
        token => {

          if (
            !token.clickable
          ) {

            sentenceElement
              .appendChild(
                document
                  .createTextNode(
                    token.text
                  )
              );

            return;

          }


          const span =
            document
              .createElement(
                "span"
              );


          span.className =
            "word";

          span.textContent =
            token.text;


          /*
            휴대폰:
            단어를 탭하면 분석

            PC:
            클릭 또는 마우스를 올리면 분석
          */

          span.addEventListener(
            "click",
            () =>
              selectWord(
                token.text,
                sentence,
                span
              )
          );


          span.addEventListener(
            "mouseenter",
            () => {

              if (
                window
                  .matchMedia(
                    "(hover:hover)"
                  )
                  .matches
              ) {

                selectWord(
                  token.text,
                  sentence,
                  span
                );

              }

            }
          );


          sentenceElement
            .appendChild(span);

        }
      );


      container
        .appendChild(
          sentenceElement
        );

    }
  );

}


/* =========================
   단어 선택
========================= */

async function selectWord(
  word,
  sentence,
  element
) {

  if (
    selectedElement ===
      element &&
    document.body
      .classList
      .contains(
        "panel-open"
      )
  ) {

    return;

  }


  if (selectedElement) {

    selectedElement
      .classList
      .remove(
        "selected"
      );

  }


  selectedElement =
    element;


  element.classList.add(
    "selected"
  );


  document.body
    .classList
    .add(
      "panel-open"
    );


  await analyzeWord(
    word,
    sentence
  );

}


/* =========================
   패널 닫기
========================= */

function closePanel() {

  document.body
    .classList
    .remove(
      "panel-open"
    );


  if (selectedElement) {

    selectedElement
      .classList
      .remove(
        "selected"
      );

  }


  selectedElement = null;

}


/* =========================
   AI 분석
========================= */

async function analyzeWord(
  word,
  sentence
) {

  const loading =
    document.getElementById(
      "analysisLoading"
    );


  const content =
    document.getElementById(
      "analysisContent"
    );


  const errorBox =
    document.getElementById(
      "error"
    );


  loading.style.display =
    "block";

  content.style.display =
    "none";

  errorBox.textContent =
    "";


  try {

    const {
      data,
      error
    } =
      await client
        .functions
        .invoke(
          "dynamic-api",
          {
            body: {
              text: word,
              type: "word",
              context: sentence
            }
          }
        );


    if (error) {
      throw error;
    }


    renderAnalysis(
      data
    );


  } catch (error) {

    console.error(
      error
    );


    content.style.display =
      "block";


    errorBox.textContent =
      "분석 중 오류가 발생했어요.\n" +
      (
        error.message ||
        String(error)
      );

  }


  loading.style.display =
    "none";

}


/* =========================
   분석 결과
========================= */

function renderAnalysis(
  data
) {

  const content =
    document.getElementById(
      "analysisContent"
    );


  content.style.display =
    "block";


  setText(
    "resultWord",
    data.word
  );


  setText(
    "resultPinyin",
    data.pinyin
  );


  setText(
    "resultMeaning",
    data.meaning
  );


  renderCharacters(
    data.characters || []
  );


  setText(
    "grammar",
    data.grammar || "—"
  );


  setText(
    "nuance",
    data.nuance || "—"
  );


  renderExpressions(
    "relatedWords",
    data.related_words || []
  );


  renderExpressions(
    "synonyms",
    data.synonyms || []
  );


  renderExpressions(
    "antonyms",
    data.antonyms || []
  );


  setText(
    "studyTip",
    data.study_tip || "—"
  );

}


/* =========================
   한자 풀이

   새 API:
   korean_hanja = "너 니"
========================= */

function renderCharacters(
  items
) {

  const box =
    document.getElementById(
      "characters"
    );


  box.innerHTML = "";


  if (!items.length) {

    box.textContent =
      "—";

    return;

  }


  items.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "character-card";


      const hanzi =
        document.createElement(
          "span"
        );


      hanzi.className =
        "character-hanzi";


      hanzi.textContent =
        item.character || "";


      const pinyin =
        document.createElement(
          "span"
        );


      pinyin.className =
        "character-pinyin";


      pinyin.textContent =
        item.pinyin || "";


      const korean =
        document.createElement(
          "span"
        );


      korean.className =
        "character-korean";


      /*
        새 결과는 korean_hanja,
        기존 캐시는 meaning일 수 있으므로
        둘 다 지원한다.
      */

      korean.textContent =
        item.korean_hanja ||
        item.korean_reading ||
        item.meaning ||
        "";


      card.appendChild(
        hanzi
      );

      card.appendChild(
        pinyin
      );

      card.appendChild(
        korean
      );


      box.appendChild(
        card
      );

    }
  );

}


/* =========================
   관련 표현 / 유의어 / 반의어

   표현마다 별도의 카드로 표시
========================= */

function renderExpressions(
  elementId,
  items
) {

  const box =
    document.getElementById(
      elementId
    );


  box.innerHTML = "";


  if (
    !Array.isArray(items) ||
    !items.length
  ) {

    box.textContent =
      "—";

    return;

  }


  items.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "expression-card";


      if (
        typeof item ===
        "string"
      ) {

        card.textContent =
          item;


        box.appendChild(
          card
        );


        return;

      }


      const firstLine =
        document.createElement(
          "div"
        );


      const word =
        document.createElement(
          "span"
        );


      word.className =
        "expression-word";


      word.textContent =
        item.word || "";


      const pinyin =
        document.createElement(
          "span"
        );


      pinyin.className =
        "expression-pinyin";


      pinyin.textContent =
        item.pinyin || "";


      firstLine.appendChild(
        word
      );

      firstLine.appendChild(
        pinyin
      );


      const meaning =
        document.createElement(
          "div"
        );


      meaning.className =
        "expression-meaning";


      let description =
        item.meaning || "";


      if (
        item.difference
      ) {

        description +=
          (
            description
              ? "\n"
              : ""
          ) +
          item.difference;

      }


      /*
        새 AI가 관련 표현별 예문을 보내면
        각각의 표현 아래에 표시한다.
      */

      const example =
        item.example ||
        item.example_sentence ||
        "";


      const examplePinyin =
        item.example_pinyin ||
        "";


      const exampleMeaning =
        item.example_meaning ||
        "";


      if (example) {

        description +=
          (
            description
              ? "\n"
              : ""
          ) +
          example;

      }


      if (examplePinyin) {

        description +=
          "\n" +
          examplePinyin;

      }


      if (exampleMeaning) {

        description +=
          "\n" +
          exampleMeaning;

      }


      meaning.textContent =
        description;


      card.appendChild(
        firstLine
      );

      card.appendChild(
        meaning
      );


      box.appendChild(
        card
      );

    }
  );

}


/* =========================
   안전하게 텍스트 표시
========================= */

function setText(
  id,
  value
) {

  document
    .getElementById(id)
    .textContent =
      value || "—";

}
