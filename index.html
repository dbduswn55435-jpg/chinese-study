<script>

/* Supabase */

const SUPABASE_URL =
"https://izdxvlcpaplrtmcinwkz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HZvFWsF9fq4nzmtXy9_Okw_yfIq3RNw";

const client =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* PDF */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let selectedElement = null;


/* 파일 버튼 */

["pdfInput","pdfInputBig"]
.forEach(id => {

  document
  .getElementById(id)
  .addEventListener(
    "change",
    e => handlePDF(e.target.files[0])
  );

});


["imageInput","imageInputBig"]
.forEach(id => {

  document
  .getElementById(id)
  .addEventListener(
    "change",
    e => handleImage(e.target.files[0])
  );

});


function showStatus(text) {

  const el =
  document.getElementById("status");

  el.textContent = text;

  el.style.display = "block";

}


function hideStatus() {

  document
  .getElementById("status")
  .style.display = "none";

}


function containsChinese(text) {

  return /[\u3400-\u9fff]/.test(text);

}


/* PDF 줄 복원 */

function extractPageLines(items) {

  const source =
  items
  .filter(
    item =>
    item.str &&
    item.str.trim()
  )
  .map(item => ({

    text:item.str.trim(),

    x:
    item.transform
      ? item.transform[4]
      : 0,

    y:
    item.transform
      ? item.transform[5]
      : 0,

    width:
    item.width || 0

  }));


  const lines = [];

  const tolerance = 3.5;


  source.forEach(item => {

    let line =
    lines.find(
      l =>
      Math.abs(
        l.y - item.y
      ) <= tolerance
    );


    if (!line) {

      line = {
        y:item.y,
        items:[]
      };

      lines.push(line);

    }


    line.items.push(item);

  });


  lines.sort(
    (a,b) =>
    b.y - a.y
  );


  return lines.map(line => {

    line.items.sort(
      (a,b) =>
      a.x - b.x
    );


    let text = "";

    let previous = null;


    line.items.forEach(item => {

      if (previous) {

        const gap =
        item.x -
        (
          previous.x +
          previous.width
        );


        if (gap > 3) {
          text += " ";
        }

      }


      text += item.text;

      previous = item;

    });


    return text.trim();

  });

}


/* 시간 찾기 */

function findTime(text) {

  const match =
  text.match(
    /(?:^|\s)(\d{1,2}:\d{2})(?:\s|$)/
  );


  return match
    ? match[1]
    : "";

}


/*
  핵심:
  PDF 전체에서

  1:51 병음
  한국어
  我平时不怎么喝酒的

  같은 구조가 나오면

  시간은 기억해 두었다가
  다음 중국어 줄에 붙인다.

  화면에는
  시간 + 중국어만 보인다.
*/

function buildChineseRows(lines) {

  const rows = [];

  let currentTime = "";


  for (
    const original of lines
  ) {

    const line =
    original.trim();


    if (!line) continue;


    const time =
    findTime(line);


    if (time) {

      currentTime =
      time;

    }


    /*
      중국어 한자가 없는 줄은
      병음/한국어/영어/시간 줄이므로
      화면에 넣지 않는다.
    */

    if (
      !containsChinese(line)
    ) {

      continue;

    }


    /*
      혹시 중국어 줄 안에
      시간도 같이 있으면 제거
    */

    let chinese =
    line
    .replace(
      /\b\d{1,2}:\d{2}\b/g,
      ""
    )
    .trim();


    if (!chinese) {
      continue;
    }


    rows.push({

      time:
      time ||
      currentTime ||
      "",

      chinese:
      chinese

    });


    /*
      한 시간표시는
      한 중국어 대사에만 사용
    */

    currentTime = "";

  }


  return rows;

}


/* PDF 읽기 */

async function handlePDF(file) {

  if (!file) return;


  showStatus(
    "PDF를 읽고 있어요..."
  );


  try {

    const buffer =
    await file.arrayBuffer();


    const pdf =
    await pdfjsLib
    .getDocument({
      data:buffer
    })
    .promise;


    const allLines = [];


    for (
      let pageNumber = 1;
      pageNumber <= pdf.numPages;
      pageNumber++
    ) {

      showStatus(
        `PDF ${pageNumber}/${pdf.numPages} 페이지 읽는 중...`
      );


      const page =
      await pdf.getPage(
        pageNumber
      );


      const content =
      await page
      .getTextContent();


      const lines =
      extractPageLines(
        content.items
      );


      allLines.push(
        ...lines
      );

    }


    const rows =
    buildChineseRows(
      allLines
    );


    if (!rows.length) {

      alert(
        "PDF에서 중국어 대사를 찾지 못했어요."
      );

      return;

    }


    openDocument(
      rows,
      file.name
    );


  }

  catch(error) {

    console.error(error);

    alert(
      "PDF를 읽는 중 오류가 발생했어요."
    );

  }

  finally {

    hideStatus();

  }

}


/* 사진 OCR */

async function handleImage(file) {

  if (!file) return;


  showStatus(
    "사진 속 글자를 읽고 있어요..."
  );


  try {

    const result =
    await Tesseract.recognize(
      file,
      "chi_sim+eng"
    );


    const lines =
    result.data.text
    .split(/\n+/)
    .map(x => x.trim())
    .filter(Boolean);


    const rows =
    buildChineseRows(
      lines
    );


    if (!rows.length) {

      alert(
        "중국어를 찾지 못했어요."
      );

      return;

    }


    openDocument(
      rows,
      file.name
    );

  }

  catch(error) {

    console.error(error);

    alert(
      "사진을 읽는 중 오류가 발생했어요."
    );

  }

  finally {

    hideStatus();

  }

}


/* 문서 표시 */

function openDocument(
  rows,
  fileName
) {

  document
  .getElementById(
    "startScreen"
  )
  .style.display =
  "none";


  document
  .getElementById(
    "studyApp"
  )
  .style.display =
  "block";


  document
  .getElementById(
    "documentTitle"
  )
  .textContent =
  fileName || "";


  renderRows(rows);


  window.scrollTo(
    0,
    0
  );

}


/* 중국어 단어 분리 */

function segmentChinese(text) {

  if (
    Intl &&
    Intl.Segmenter
  ) {

    const segmenter =
    new Intl.Segmenter(
      "zh",
      {
        granularity:"word"
      }
    );


    return [
      ...segmenter.segment(text)
    ]
    .map(item => ({

      text:
      item.segment,

      clickable:
      item.isWordLike &&
      containsChinese(
        item.segment
      )

    }));

  }


  return [...text]
  .map(char => ({

    text:char,

    clickable:
    containsChinese(char)

  }));

}


/* 화면 출력 */

function renderRows(rows) {

  const box =
  document.getElementById(
    "scriptText"
  );


  box.innerHTML = "";


  rows.forEach(row => {

    const wrapper =
    document.createElement(
      "div"
    );


    wrapper.className =
    "script-row";


    const time =
    document.createElement(
      "div"
    );


    time.className =
    "time";


    time.textContent =
    row.time || "";


    const chinese =
    document.createElement(
      "div"
    );


    chinese.className =
    "chinese";


    const tokens =
    segmentChinese(
      row.chinese
    );


    tokens.forEach(token => {

      if (
        !token.clickable
      ) {

        chinese.appendChild(
          document.createTextNode(
            token.text
          )
        );

        return;

      }


      const span =
      document.createElement(
        "span"
      );


      span.className =
      "word";


      span.textContent =
      token.text;


      /*
        모바일에서는 탭,
        PC에서는 클릭
      */

      span.addEventListener(
        "click",
        () => {

          selectWord(
            token.text,
            row.chinese,
            span
          );

        }
      );


      chinese.appendChild(
        span
      );

    });


    wrapper.appendChild(
      time
    );


    wrapper.appendChild(
      chinese
    );


    box.appendChild(
      wrapper
    );

  });

}


/* 단어 선택 */

async function selectWord(
  word,
  sentence,
  element
) {

  if (selectedElement) {

    selectedElement
    .classList
    .remove(
      "selected"
    );

  }


  selectedElement =
  element;


  element
  .classList
  .add(
    "selected"
  );


  document.body
  .classList
  .add(
    "panel-open"
  );


  /*
    사용자가 단어를 누르자마자
    선택한 단어를 먼저 보여준다.
  */

  document
  .getElementById(
    "resultWord"
  )
  .textContent =
  word;


  await analyzeWord(
    word,
    sentence
  );

}


/* 닫기 */

function closePanel() {

  document.body
  .classList
  .remove(
    "panel-open"
  );


  if (selectedElement) {

    selectedElement
    .classList
    .remove(
      "selected"
    );

  }


  selectedElement =
  null;

}


/* AI 호출 */

async function analyzeWord(
  word,
  sentence
) {

  const loading =
  document.getElementById(
    "analysisLoading"
  );


  const content =
  document.getElementById(
    "analysisContent"
  );


  const errorBox =
  document.getElementById(
    "error"
  );


  loading.style.display =
  "block";


  content.style.display =
  "none";


  errorBox.textContent =
  "";


  try {

    const {
      data,
      error
    } =
    await client.functions.invoke(
      "dynamic-api",
      {
        body:{
          text:word,
          type:"word",
          context:sentence
        }
      }
    );


    if (error) {

      throw error;

    }


    if (!data) {

      throw new Error(
        "분석 결과가 비어 있습니다."
      );

    }


    renderAnalysis(
      data
    );

  }

  catch(error) {

    console.error(error);


    content.style.display =
    "block";


    errorBox.textContent =
    "AI 분석 요청에 실패했어요.\n\n" +
    (
      error.message ||
      String(error)
    );

  }

  finally {

    loading.style.display =
    "none";

  }

}


/* 결과 표시 */

function renderAnalysis(data) {

  const content =
  document.getElementById(
    "analysisContent"
  );


  content.style.display =
  "block";


  setText(
    "resultWord",
    data.word
  );


  setText(
    "resultPinyin",
    data.pinyin
  );


  setText(
    "resultMeaning",
    data.meaning
  );


  renderCharacters(
    data.characters || []
  );


  setText(
    "grammar",
    data.grammar || "—"
  );


  setText(
    "nuance",
    data.nuance || "—"
  );


  renderExpressions(
    "relatedWords",
    data.related_words || []
  );


  renderExpressions(
    "synonyms",
    data.synonyms || []
  );


  renderExpressions(
    "antonyms",
    data.antonyms || []
  );


  setText(
    "studyTip",
    data.study_tip || "—"
  );

}


/* 한자 풀이 */

function renderCharacters(
  items
) {

  const box =
  document.getElementById(
    "characters"
  );


  box.innerHTML = "";


  if (
    !Array.isArray(items) ||
    !items.length
  ) {

    box.textContent =
    "—";

    return;

  }


  items.forEach(item => {

    const card =
    document.createElement(
      "div"
    );


    card.className =
    "character-card";


    const hanzi =
    document.createElement(
      "span"
    );


    hanzi.className =
    "character-hanzi";


    hanzi.textContent =
    item.character || "";


    const pinyin =
    document.createElement(
      "span"
    );


    pinyin.className =
    "character-pinyin";


    pinyin.textContent =
    item.pinyin || "";


    const korean =
    document.createElement(
      "span"
    );


    korean.className =
    "character-korean";


    korean.textContent =
    item.korean_hanja ||
    item.korean_reading ||
    item.meaning ||
    "";


    card.appendChild(
      hanzi
    );


    card.appendChild(
      pinyin
    );


    card.appendChild(
      korean
    );


    box.appendChild(
      card
    );

  });

}


/* 관련 표현 */

function renderExpressions(
  id,
  items
) {

  const box =
  document.getElementById(
    id
  );


  box.innerHTML = "";


  if (
    !Array.isArray(items) ||
    !items.length
  ) {

    box.textContent =
    "—";

    return;

  }


  items.forEach(item => {

    const card =
    document.createElement(
      "div"
    );


    card.className =
    "expression-card";


    if (
      typeof item ===
      "string"
    ) {

      card.textContent =
      item;


      box.appendChild(
        card
      );


      return;

    }


    const title =
    document.createElement(
      "div"
    );


    const word =
    document.createElement(
      "span"
    );


    word.className =
    "expression-word";


    word.textContent =
    item.word || "";


    const pinyin =
    document.createElement(
      "span"
    );


    pinyin.className =
    "expression-pinyin";


    pinyin.textContent =
    item.pinyin || "";


    title.appendChild(
      word
    );


    title.appendChild(
      pinyin
    );


    const detail =
    document.createElement(
      "div"
    );


    detail.className =
    "expression-detail";


    const parts = [];


    if (item.meaning) {
      parts.push(
        item.meaning
      );
    }


    if (item.difference) {
      parts.push(
        item.difference
      );
    }


    if (
      item.example ||
      item.example_sentence
    ) {

      parts.push(
        item.example ||
        item.example_sentence
      );

    }


    if (
      item.example_pinyin
    ) {

      parts.push(
        item.example_pinyin
      );

    }


    if (
      item.example_meaning
    ) {

      parts.push(
        item.example_meaning
      );

    }


    detail.textContent =
    parts.join("\n");


    card.appendChild(
      title
    );


    card.appendChild(
      detail
    );


    box.appendChild(
      card
    );

  });

}


function setText(
  id,
  value
) {

  document
  .getElementById(id)
  .textContent =
  value || "—";

}
